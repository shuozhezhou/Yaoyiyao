<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>爻一爻 · 周易金钱卦</title>
<meta name="theme-color" content="#0f0c08">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="爻一爻">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12100c; --panel:#1c1812; --panel2:#241f17; --line:#3a3327;
    --gold:#c9a55a; --gold-dim:#8a7440; --ink:#e9e2d2; --ink-dim:#a99e86;
    --yang:#d9b872; --yin:#8f8468; --accent:#c0492f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:radial-gradient(circle at 50% -10%,#241d13 0%,var(--bg) 60%);
    color:var(--ink);font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
    min-height:100vh;display:flex;justify-content:center;padding:20px 14px 60px;}
  .app{width:100%;max-width:460px;}
  header{text-align:center;margin:8px 0 18px;}
  header h1{margin:0;font-size:30px;letter-spacing:8px;color:var(--gold);font-weight:600;}
  header p{margin:6px 0 0;font-size:12px;letter-spacing:2px;color:var(--ink-dim);}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:18px 16px;margin-bottom:16px;box-shadow:0 8px 30px rgba(0,0,0,.35);}

  .hexwrap{display:flex;justify-content:center;gap:34px;}
  .hexcol{display:flex;flex-direction:column-reverse;gap:9px;align-items:center;}
  .hexcol .label{font-size:12px;color:var(--gold-dim);letter-spacing:2px;margin-top:4px;order:99;}
  .yao{width:150px;height:16px;display:flex;gap:12px;position:relative;opacity:.18;
    transition:opacity .4s ease, transform .4s ease;transform:translateY(6px);}
  .yao.on{opacity:1;transform:translateY(0);}
  .bar{background:linear-gradient(180deg,var(--yang),#b8945a);border-radius:3px;height:100%;box-shadow:0 1px 2px rgba(0,0,0,.4);}
  .yao.yang .bar{flex:1;}
  .yao.yin .bar{flex:1;background:linear-gradient(180deg,var(--yin),#6f664e);}
  .yao .mark{position:absolute;right:-24px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--accent);font-weight:bold;}
  .yao .idx{position:absolute;left:-30px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--ink-dim);white-space:nowrap;}

  .coins{display:flex;justify-content:center;gap:16px;margin:20px 0 6px;height:56px;align-items:center;}
  .coin{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:20px;border:2px solid var(--gold-dim);
    background:radial-gradient(circle at 35% 30%,#3a3120,#211b12);color:var(--gold);
    box-shadow:inset 0 0 6px rgba(0,0,0,.6);transition:transform .1s;}
  .coin.flip{animation:flip .5s ease;}
  @keyframes flip{0%{transform:rotateY(0) scale(1);}50%{transform:rotateY(540deg) scale(1.15);}100%{transform:rotateY(1080deg) scale(1);}}
  .coin.yang{border-color:var(--gold);color:var(--yang);}
  .coin.yin{border-color:#5c5342;color:var(--yin);}

  .qinput{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);font-family:inherit;font-size:14px;padding:10px 12px;margin-bottom:12px;}
  .qinput::placeholder{color:var(--ink-dim);}
  .status{text-align:center;font-size:13px;color:var(--ink-dim);min-height:20px;letter-spacing:1px;margin-bottom:12px;}

  .btnrow{display:flex;gap:10px;}
  button{padding:14px;border:none;border-radius:12px;font-size:16px;letter-spacing:3px;font-family:inherit;cursor:pointer;transition:.2s;}
  .btn-main{flex:1;background:linear-gradient(180deg,var(--gold),#a9863f);color:#1a150c;font-weight:600;box-shadow:0 4px 14px rgba(201,165,90,.3);}
  .btn-main:active{transform:translateY(1px);}
  .btn-main:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;}
  .btn-reset{background:transparent;border:1px solid var(--line);color:var(--ink-dim);flex:0 0 88px;}

  #result{display:none;}
  #result.show{display:block;animation:fade .5s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .gua-title{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px;}
  .gua-title .big{font-size:22px;color:var(--gold);letter-spacing:3px;}
  .gua-title .sym{font-size:30px;line-height:1;}
  .gua-sub{font-size:13px;color:var(--ink-dim);margin-bottom:6px;letter-spacing:1px;}
  .gua-text{font-size:15px;line-height:1.9;color:var(--ink);}
  .gua-text .bai{display:block;color:var(--ink-dim);font-size:13px;margin-top:2px;}
  .xiang{font-size:13px;color:var(--gold-dim);margin-top:6px;font-style:normal;}
  .divider{height:1px;background:var(--line);margin:16px 0;}
  .rule{background:var(--panel2);border-left:3px solid var(--gold);padding:12px 14px;border-radius:6px;font-size:14px;line-height:1.9;color:var(--ink);margin-top:8px;}
  .rule b{color:var(--gold);}
  .rule .yaoline{margin:6px 0;padding-left:8px;border-left:2px solid var(--gold-dim);}
  .rule .yaoline .bai{display:block;color:var(--ink-dim);font-size:12.5px;}
  .sect{font-size:14px;color:var(--gold);letter-spacing:2px;margin-bottom:2px;}

  .catlabel{font-size:12px;color:var(--gold-dim);letter-spacing:1px;margin-bottom:8px;}
  .cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .cat{font-size:13px;padding:6px 14px;border:1px solid var(--line);border-radius:20px;color:var(--ink-dim);cursor:pointer;transition:.15s;user-select:none;}
  .cat.on{border-color:var(--gold);color:var(--gold);background:rgba(201,165,90,.1);}
  .detailbox{font-size:14px;line-height:1.95;color:var(--ink);}
  .detailbox .d-para{margin:2px 0 10px;}
  .detailbox .d-cat{background:var(--panel2);border-left:3px solid var(--gold);padding:10px 12px;border-radius:6px;margin:8px 0;}
  .detailbox .d-cat b{color:var(--gold);}
  .detailbox .d-advice{color:var(--gold-dim);margin-top:6px;}
  .detailbox .d-note{color:var(--ink-dim);font-size:12px;}
  .hist-item{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer;transition:.15s;}
  .hist-item:hover{border-color:var(--gold-dim);}
  .hist-item .h1{font-size:14px;color:var(--gold);}
  .hist-item .h2{font-size:11px;color:var(--ink-dim);margin-top:2px;}
  .hist-empty{font-size:12px;color:var(--ink-dim);margin-top:8px;}
  .hist-head{display:flex;justify-content:space-between;align-items:center;}
  .link{background:none;border:none;color:var(--ink-dim);font-size:12px;padding:4px 8px;letter-spacing:1px;cursor:pointer;}
  .link:hover{color:var(--gold);}

  details summary{cursor:pointer;color:var(--gold-dim);font-size:12px;letter-spacing:1px;outline:none;}
  .method{font-size:11.5px;color:var(--ink-dim);line-height:1.85;letter-spacing:.3px;margin-top:10px;}
  .method b{color:var(--gold-dim);}

  .btn-lang{position:fixed;top:12px;left:12px;z-index:200;background:rgba(28,24,18,.92);border:1px solid var(--gold-dim);color:var(--gold);font-size:12px;letter-spacing:1px;padding:7px 13px;border-radius:20px;font-family:inherit;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.45);}
  .btn-lang:active{transform:translateY(1px);}
  .warn{color:var(--accent);font-size:12px;text-align:center;margin-bottom:12px;}
  .casttime{font-size:11.5px;color:var(--ink-dim);letter-spacing:.5px;margin-bottom:10px;text-align:center;}
  .rel-item{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px;flex-wrap:wrap;}
  .rel-item:last-child{border-bottom:none;}
  .rel-tag{display:inline-block;min-width:80px;color:var(--gold);font-size:12px;}
  .rel-sym{font-size:20px;line-height:1;}
  .rel-desc{color:var(--ink-dim);font-size:12px;flex:1;}
  .method-row{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:12px;font-size:12px;color:var(--ink-dim);}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .seg-btn{padding:5px 14px;cursor:pointer;color:var(--ink-dim);font-size:12px;user-select:none;}
  .seg-btn.on{background:var(--gold-dim);color:#1a150c;}
  #najiaWrap{margin-top:4px;}
  #najiaWrap>summary{cursor:pointer;color:var(--gold);}
  .najia-guide{font-size:12.5px;color:var(--ink);line-height:1.85;background:var(--panel2);border-radius:8px;padding:10px 12px;margin:10px 0;}
  .najia-guide b{color:var(--gold);}
  .nj-table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0;}
  .nj-table td{padding:5px 3px;border-bottom:1px solid var(--line);white-space:nowrap;}
  .nj-god{color:var(--ink-dim);}
  .nj-qin{color:var(--gold);font-weight:600;}
  .nj-bar{font-family:monospace;letter-spacing:-1px;color:var(--yang);}
  .nj-mark{color:var(--accent);font-weight:bold;}
  .nj-state{color:var(--ink-dim);font-size:10.5px;}
  .nj-bian{color:var(--yin);font-size:11px;}
  .nj-row-yong{background:rgba(201,165,90,.13);}
  .najia-legend{font-size:11.5px;color:var(--ink-dim);line-height:1.8;margin-top:8px;}
  .najia-legend b{color:var(--gold-dim);}
  .najia-verdict{font-size:12.5px;color:var(--ink);line-height:1.9;background:rgba(201,165,90,.10);border:1px solid var(--gold-dim);border-radius:8px;padding:10px 12px;margin:8px 0;}
  .najia-verdict b{color:var(--gold);}
  .nj-fu{color:#7f9a86;font-size:10.5px;display:block;}
  .nj-table th{color:var(--gold-dim);font-size:11px;font-weight:600;text-align:left;padding:4px 3px;border-bottom:1px solid var(--gold-dim);white-space:nowrap;}
  /* ---- 英文模式适配：收窄字距、允许换行、表格可横向滚动 ---- */
  html.lang-en header p{letter-spacing:.5px;}
  html.lang-en .btn-main,html.lang-en .btn-reset{letter-spacing:.5px;}
  html.lang-en .btn-lang,html.lang-en .cat,html.lang-en .seg-btn,html.lang-en .catlabel,html.lang-en .method-row{letter-spacing:0;}
  html.lang-en .sect,html.lang-en .gua-title .big{letter-spacing:.5px;}
  html.lang-en .gua-sub{letter-spacing:0;}
  html.lang-en .yao .idx{font-size:10px;left:-40px;}
  #najiaBox{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  html.lang-en .nj-table{font-size:11px;}
  html.lang-en .nj-table td,html.lang-en .nj-table th{padding:5px 5px;}
  .copy-row{margin-top:14px;text-align:center;}
  .btn-copy{background:linear-gradient(180deg,var(--gold),#a9863f);color:#1a150c;font-weight:600;border:none;border-radius:12px;padding:12px 22px;font-size:14px;font-family:inherit;cursor:pointer;letter-spacing:.5px;}
  .btn-copy:active{transform:translateY(1px);}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:rgba(28,24,18,.96);border:1px solid var(--gold-dim);color:var(--gold);padding:10px 18px;border-radius:22px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:300;max-width:82%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ===================== 视觉精修（覆盖层） ===================== */
  :root{
    --bg:#0f0c08; --panel:#181410; --panel2:#211b14; --line:#332c22;
    --gold:#cda65f; --gold-bright:#e6c37c; --gold-dim:#8a7440;
    --ink:#ece5d6; --ink-dim:#a99f88; --yang:#dcb978; --yin:#8f8468; --accent:#c85a3f;
    --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
    --sans:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    --r-lg:18px; --r-md:12px;
    --shadow:0 12px 36px rgba(0,0,0,.5); --dur:220ms; --ease:cubic-bezier(.22,.61,.36,1);
  }
  body{font-family:var(--sans);background:radial-gradient(120% 60% at 50% -8%,#241c11 0%,#0f0c08 58%);
    padding:22px 16px calc(64px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  .app{max-width:468px;}
  header{margin:4px 0 24px;}
  header h1{font-family:var(--serif);font-size:28px;font-weight:600;letter-spacing:12px;text-indent:12px;color:var(--gold);}
  @supports ((-webkit-background-clip:text) or (background-clip:text)){
    header h1{background:linear-gradient(180deg,var(--gold-bright),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
  }
  header p{margin-top:12px;font-size:11px;letter-spacing:3px;color:var(--ink-dim);}
  header::after{content:"";display:block;width:60px;height:1px;margin:15px auto 0;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 18px;box-shadow:var(--shadow);}
  button:focus-visible,.cat:focus-visible,.seg-btn:focus-visible,.qinput:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .hexwrap{gap:38px;}
  .hexcol{gap:11px;}
  .hexcol .label{font-family:var(--sans);font-size:11px;letter-spacing:3px;color:var(--gold-dim);}
  .yao{width:158px;height:18px;gap:14px;}
  .bar{border-radius:4px;background:linear-gradient(180deg,var(--gold-bright),#b8945a 55%,#997c45);box-shadow:0 1px 2px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,240,205,.3);}
  .yao.yin .bar{background:linear-gradient(180deg,#9a8f72,#726a52 55%,#5b5443);box-shadow:0 1px 2px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);}
  .yao .mark{right:-26px;color:var(--accent);font-weight:700;}
  .yao .idx{font-family:var(--sans);left:-32px;color:var(--ink-dim);}
  .coins{gap:18px;height:60px;}
  .coin{width:52px;height:52px;font-family:var(--serif);font-weight:600;color:var(--gold);border:1.5px solid var(--gold-dim);background:radial-gradient(circle at 34% 30%,#463a25,#201a11 72%);box-shadow:inset 0 1px 3px rgba(255,220,150,.16),inset 0 -3px 7px rgba(0,0,0,.6),0 3px 9px rgba(0,0,0,.45);}
  .coin.yang{border-color:var(--gold);color:var(--gold-bright);}
  .qinput{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-md);font-family:var(--sans);font-size:14px;padding:12px 14px;transition:border-color var(--dur),box-shadow var(--dur);}
  .qinput:focus{border-color:var(--gold-dim);box-shadow:0 0 0 3px rgba(201,165,90,.12);outline:none;}
  .status{font-family:var(--sans);font-size:13px;letter-spacing:.5px;color:var(--ink-dim);}
  button{font-family:var(--sans);}
  .btnrow{gap:12px;}
  .btn-main{min-height:50px;border-radius:var(--r-md);font-size:16px;letter-spacing:5px;font-weight:600;color:#1c1710;background:linear-gradient(180deg,var(--gold-bright),#a9863f);box-shadow:0 6px 18px rgba(201,165,90,.26);transition:filter var(--dur),transform .1s,box-shadow var(--dur);}
  .btn-main:hover:not(:disabled){filter:brightness(1.06);}
  .btn-main:active:not(:disabled){transform:translateY(1px);box-shadow:0 3px 10px rgba(201,165,90,.22);}
  .btn-reset{flex:0 0 92px;min-height:50px;border-radius:var(--r-md);letter-spacing:2px;transition:var(--dur);}
  .btn-reset:hover{border-color:var(--gold-dim);color:var(--gold);}
  .btn-lang{top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));background:rgba(24,20,16,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--gold-dim);border-radius:20px;transition:var(--dur);}
  .btn-lang:hover{border-color:var(--gold);color:var(--gold-bright);}
  .cat{border-radius:20px;transition:var(--dur);}
  .cat:hover{border-color:var(--gold-dim);color:var(--ink);}
  .cat.on{border-color:var(--gold);color:#1c1710;background:linear-gradient(180deg,var(--gold-bright),#b8945a);font-weight:600;}
  .seg{border-radius:18px;}
  .seg-btn{transition:var(--dur);}
  .seg-btn.on{background:linear-gradient(180deg,var(--gold-bright),#b8945a);color:#1c1710;font-weight:600;}
  #result.show{animation:fade var(--dur) var(--ease);}
  .gua-title{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px;}
  .gua-title .big{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:3px;color:var(--gold);}
  .gua-sub{font-family:var(--sans);color:var(--ink-dim);}
  .gua-text{font-family:var(--serif);font-size:15.5px;line-height:1.95;}
  .gua-text .bai{font-family:var(--sans);color:var(--ink-dim);font-size:13px;margin-top:4px;line-height:1.7;}
  .xiang{font-family:var(--serif);color:var(--gold-dim);}
  .sect{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:3px;color:var(--gold);}
  .divider{background:linear-gradient(90deg,transparent,var(--line),transparent);height:1px;margin:18px 0;}
  .rule{background:var(--panel2);border-left:3px solid var(--gold);border-radius:var(--r-md);padding:12px 14px;}
  .rule .yaoline .bai,.detailbox .d-para{font-family:var(--serif);}
  .detailbox{font-size:14px;}
  .detailbox .d-para{line-height:2;}
  .detailbox .d-cat{border-radius:var(--r-md);}
  .hist-item{border-radius:var(--r-md);transition:var(--dur);}
  .hist-item:hover{border-color:var(--gold-dim);background:rgba(201,165,90,.06);}
  .casttime,.nj-table,.nj-state{font-variant-numeric:tabular-nums;}
  .nj-table td,.nj-table th{padding:6px 4px;}
  .najia-guide,.najia-verdict{border-radius:var(--r-md);}
  .btn-copy{display:inline-flex;align-items:center;gap:8px;min-height:48px;border-radius:var(--r-md);background:linear-gradient(180deg,var(--gold-bright),#a9863f);color:#1c1710;font-weight:600;letter-spacing:.5px;box-shadow:0 5px 16px rgba(201,165,90,.24);transition:filter var(--dur),transform .1s;}
  .btn-copy:hover{filter:brightness(1.06);}
  .btn-copy:active{transform:translateY(1px);}
  .btn-copy .ic{stroke:currentColor;fill:none;stroke-width:2;flex:0 0 auto;}
  .toast{background:rgba(24,20,16,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--gold-dim);border-radius:22px;}
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
  }
</style>
</head>
<body>
<button class="btn-lang" id="transBtn" onclick="toggleLang()"></button>
<div class="toast" id="toast"></div>
<div class="app">
  <header>
    <h1>爻 一 爻</h1>
    <p id="subtitle"></p>
  </header>

  <div class="card">
    <div id="dataWarn" class="warn" style="display:none"></div>
    <div class="hexwrap">
      <div class="hexcol" id="benCol"><div class="label" id="benLabel"></div></div>
      <div class="hexcol" id="bianCol" style="opacity:.3"><div class="label" id="bianLabel"></div></div>
    </div>

    <div class="coins" id="coins">
      <div class="coin">爻</div><div class="coin">爻</div><div class="coin">爻</div>
    </div>
    <div class="status" id="status"></div>

    <div class="method-row"><span id="methodLabel"></span>
      <span class="seg">
        <span class="seg-btn on" id="segCoin" onclick="setMethod('coin')"></span>
        <span class="seg-btn" id="segYarrow" onclick="setMethod('yarrow')"></span>
      </span>
    </div>

    <div class="catlabel" id="catLabel"></div>
    <div class="cats" id="cats"></div>
    <input class="qinput" id="qInput" type="text" maxlength="60">
    <div class="btnrow">
      <button class="btn-main" id="tossBtn" onclick="toss()"><span id="tossText"></span>　<span id="step">(1/6)</span></button>
      <button class="btn-reset" id="resetBtn" onclick="resetAll()"></button>
    </div>
